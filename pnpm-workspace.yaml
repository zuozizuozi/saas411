allowBuilds:
  # Native/build-time dependencies required by Next.js and the toolchain.
  '@biomejs/biome': true
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  '@tsparticles/engine': true
  '@vercel/speed-insights': true
  bufferutil: true
  core-js: false
  esbuild: true
  prisma: true
  sharp: true
  utf-8-validate: true
minimumReleaseAgeExclude:
  - '@posthog/browser-common@0.3.1'
  - '@posthog/core@1.46.1'
  - posthog-js@1.409.5
overrides:
  # Patched transitive dependency pulled by Drizzle's optional Gel adapter.
  shell-quote: 1.10.0
